<!DOCTYPE html>

<head>
  <meta charset="utf-8">

  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var hour = new Date().getHours();
        var stored = localStorage.getItem("tur-book-mode");
        if (stored === "night" || stored === "day") {
          if (stored === "night") document.documentElement.setAttribute("data-mode", "night");
        } else if (hour >= 19 || hour < 7) {
          document.documentElement.setAttribute("data-mode", "night");
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="prompt" href="https://turtyhyi.com/">tur_tyhyi@root:~$</a>
    <nav class="tools" aria-label="Controls">
      <a class="tool-link" href="https://turtyhyi.com/#books">[home]</a>
      <button type="button" class="tool-btn" id="toc-toggle" aria-expanded="false" aria-controls="toc">
        [toc]
      </button>
      <button type="button" class="tool-btn" id="random-entry">
        [any]
      </button>
      <button type="button" class="tool-btn" id="mode-toggle" aria-pressed="false" title="Day / night">
        [mode]
      </button>
    </nav>
  </header>

  <aside id="toc" class="toc" hidden>
    <p class="toc-lead">&gt; ls ./entries</p>
    <p class="toc-hint">The visible part of life is always later than its true beginning.</p>
    <nav id="toc-list"></nav>
  </aside>

  <main>
    <section class="term-window book-window" aria-label="Book">
      <div class="term-bar">
        <div class="term-dots" aria-hidden="true">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
        </div>
        <p class="term-title">the-shadow-phase.md — v1.1</p>
        <p class="mark">THE SHADOW PHASE</p>
      </div>
      <article id="book" class="book term-body">
        <p class="loading">&gt; loading field…</p>
      </article>
    </section>
  </main>

  <footer class="colophon">
    <p>&gt; cat ./colophon.md</p>
